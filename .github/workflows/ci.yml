name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (tests, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Cache the in-memory MongoDB binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ hashFiles('backend/package-lock.json') }}
      - run: npm ci
      - run: npm test
      - name: Known vulnerabilities in production dependencies
        run: npm audit --omit=dev --audit-level=high

  app:
    name: App (lint, tests, production build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --watch=false --browsers=ChromeHeadlessCI
      - run: npm run build -- --configuration production
      - name: Known vulnerabilities in production dependencies
        run: npm audit --omit=dev --audit-level=high
